<div id="simuemploi-candidat-v1">
  <div class="se-preview-controls">
    <label>Écran <select id="se-screen"></select></label>
    <label>Situation <select id="se-situation"><option value="normal">Fonctionnement normal</option><option value="empty">Première utilisation</option><option value="loading">Analyse en cours</option><option value="offline">Connexion interrompue</option><option value="failed">Analyse indisponible</option><option value="partial">Rapport partiel</option></select></label>
    <span class="se-preview-note">Maquettes · exemples fictifs · aucune donnée envoyée</span>
  </div>
  <div class="viz-carousel" aria-label="Variantes du parcours candidat" data-previous-label="Précédente" data-next-label="Suivante">
    <section data-variant="Parcours guidé" aria-label="Parcours guidé"><div class="se-product se-guided" id="se-guided"></div></section>
    <section data-variant="Espace autonome" aria-label="Espace autonome" hidden><div class="se-product se-autonomous" id="se-autonomous"></div></section>
  </div>
</div>
<style>
#simuemploi-candidat-v1 .se-preview-controls{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:16px;padding-right:95px;font-family:system-ui,sans-serif;color:light-dark(#354b50,#d2e4e6);font-size:13px}
#simuemploi-candidat-v1 .se-preview-controls label{display:grid;gap:5px;min-width:180px}
#simuemploi-candidat-v1 .se-preview-controls select{font:inherit;padding:9px 12px;border:1px solid light-dark(#cedada,#395156);border-radius:9px;color:light-dark(#17373b,#e0f4f4);background:light-dark(#fff,#182a2d);max-width:100%;width:100%;min-width:0}
#simuemploi-candidat-v1 .se-preview-note{font-size:12px;flex:1 1 240px}
#simuemploi-candidat-v1 .se-product{--se-bg:light-dark(#f5f8f7,#111c1e);--se-surface:light-dark(#fff,#1a2a2d);--se-ink:light-dark(#1a353a,#eef8f6);--se-soft:light-dark(#536b70,#abc4c5);--se-line:light-dark(#dce6e3,#354c50);--se-accent:light-dark(#12675d,#77d5bd);--se-on-accent:light-dark(#fff,#102e28);--se-tint:light-dark(#e6f2ec,#203e35);--se-warm:light-dark(#fff3cf,#473b1c);--se-error:light-dark(#8c3434,#ffc1b7);--se-error-bg:light-dark(#fff0ec,#412929);--se-radius:18px;--se-pad:26px;background:var(--se-bg);color:var(--se-ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.55;border:1px solid var(--se-line);border-radius:22px;min-height:760px;overflow-wrap:anywhere;overflow:hidden;color-scheme:light dark}
#simuemploi-candidat-v1 .se-product *{box-sizing:border-box}
#simuemploi-candidat-v1 .se-product h1,#simuemploi-candidat-v1 .se-product h2,#simuemploi-candidat-v1 .se-product h3,#simuemploi-candidat-v1 .se-product p{margin:0}
#simuemploi-candidat-v1 .se-product h1{font-size:29px;font-weight:600;line-height:1.2;letter-spacing:-.8px}
#simuemploi-candidat-v1 .se-product h2{font-size:20px;font-weight:600;line-height:1.3;letter-spacing:-.3px}
#simuemploi-candidat-v1 .se-product h3{font-size:16px;font-weight:600;line-height:1.4}
#simuemploi-candidat-v1 .se-product button,#simuemploi-candidat-v1 .se-product input,#simuemploi-candidat-v1 .se-product select,#simuemploi-candidat-v1 .se-product textarea{font:inherit}
#simuemploi-candidat-v1 .se-top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 24px;border-bottom:1px solid var(--se-line);background:var(--se-surface)}
#simuemploi-candidat-v1 .se-brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:650;letter-spacing:-.5px}
#simuemploi-candidat-v1 .se-logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--se-accent);color:var(--se-on-accent);font-size:18px}
#simuemploi-candidat-v1 .se-country{font-size:12px;color:var(--se-soft);border-left:1px solid var(--se-line);padding-left:12px}
#simuemploi-candidat-v1 .se-avatar{width:34px;height:34px;border-radius:50%;background:var(--se-tint);color:var(--se-accent);display:grid;place-items:center;font-weight:650;font-size:13px}
#simuemploi-candidat-v1 .se-shell{display:grid;grid-template-columns:164px minmax(0,1fr)}
#simuemploi-candidat-v1 .se-nav{padding:22px 13px;background:var(--se-surface);border-right:1px solid var(--se-line);display:flex;flex-direction:column;gap:7px}
#simuemploi-candidat-v1 .se-nav button{display:flex;align-items:center;gap:9px;border:0;text-align:left;color:var(--se-soft);background:transparent;padding:11px 10px;border-radius:10px;font-size:13px;min-height:44px}
#simuemploi-candidat-v1 .se-nav button[aria-current=page]{background:var(--se-tint);color:var(--se-accent);font-weight:600}
#simuemploi-candidat-v1 .se-nav .se-nav-note{margin-top:auto;padding:28px 9px 9px;font-size:12px;color:var(--se-soft)}
#simuemploi-candidat-v1 .se-main{padding:var(--se-pad);min-width:0;display:grid;align-content:start;gap:20px}
#simuemploi-candidat-v1 .se-crumb{font-size:12px;color:var(--se-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#simuemploi-candidat-v1 .se-heading{display:grid;gap:8px}
#simuemploi-candidat-v1 .se-sub{color:var(--se-soft);font-size:14px}
#simuemploi-candidat-v1 .se-kicker{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--se-accent)}
#simuemploi-candidat-v1 .se-hero{background:var(--se-tint);border-radius:var(--se-radius);padding:25px;display:grid;gap:15px;position:relative}
#simuemploi-candidat-v1 .se-hero h2{font-size:26px;max-width:420px}
#simuemploi-candidat-v1 .se-hero p{max-width:480px}
#simuemploi-candidat-v1 .se-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--se-line);border-radius:11px;background:var(--se-surface);color:var(--se-ink);padding:11px 16px;font-weight:600;font-size:13px;min-height:44px;text-decoration:none}
#simuemploi-candidat-v1 .se-btn-primary{background:var(--se-accent);border-color:var(--se-accent);color:var(--se-on-accent)}
#simuemploi-candidat-v1 .se-btn-quiet{border-color:transparent;background:transparent;color:var(--se-soft);padding-left:0}
#simuemploi-candidat-v1 .se-btn-danger{color:var(--se-error);border-color:var(--se-error)}
#simuemploi-candidat-v1 .se-product button:disabled{opacity:.55}
#simuemploi-candidat-v1 .se-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#simuemploi-candidat-v1 .se-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
#simuemploi-candidat-v1 .se-panel{background:var(--se-surface);border:1px solid var(--se-line);border-radius:var(--se-radius);padding:20px;display:grid;align-content:start;gap:13px;min-width:0}
#simuemploi-candidat-v1 .se-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#simuemploi-candidat-v1 .se-pill{font-size:11px;font-weight:600;border-radius:6px;background:var(--se-tint);color:var(--se-accent);padding:4px 8px;display:inline-block}
#simuemploi-candidat-v1 .se-pill-warm{background:var(--se-warm);color:var(--se-ink)}
#simuemploi-candidat-v1 .se-meta{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--se-soft)}
#simuemploi-candidat-v1 .se-line{height:1px;background:var(--se-line);margin:2px 0}
#simuemploi-candidat-v1 .se-list{display:grid;gap:14px;list-style:none;margin:0;padding:0}
#simuemploi-candidat-v1 .se-list li{display:flex;align-items:flex-start;gap:12px;font-size:14px}
#simuemploi-candidat-v1 .se-step{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--se-tint);color:var(--se-accent);font-size:12px;font-weight:700}
#simuemploi-candidat-v1 .se-field{display:grid;gap:7px;font-size:13px;font-weight:600}
#simuemploi-candidat-v1 .se-field input,#simuemploi-candidat-v1 .se-field select,#simuemploi-candidat-v1 .se-field textarea{width:100%;padding:11px 13px;border:1px solid var(--se-line);border-radius:10px;background:var(--se-bg);color:var(--se-ink);font-weight:400;min-height:44px}
#simuemploi-candidat-v1 .se-field textarea{min-height:155px;resize:vertical;line-height:1.7}
#simuemploi-candidat-v1 .se-check{display:flex;align-items:flex-start;gap:10px;font-size:13px}
#simuemploi-candidat-v1 .se-check input{accent-color:var(--se-accent);width:18px;height:18px;flex-shrink:0;margin-top:2px}
#simuemploi-candidat-v1 .se-note{padding:14px 16px;background:var(--se-warm);border-radius:11px;font-size:13px;color:var(--se-ink)}
#simuemploi-candidat-v1 .se-alert{padding:14px 16px;border-radius:11px;background:var(--se-error-bg);color:var(--se-error);font-size:13px}
#simuemploi-candidat-v1 .se-quote{border-left:3px solid var(--se-accent);padding:10px 14px;background:var(--se-tint);border-radius:0 10px 10px 0;font-size:14px;margin:0}
#simuemploi-candidat-v1 .se-section{display:grid;gap:12px}
#simuemploi-candidat-v1 .se-meter{height:5px;background:var(--se-line);border-radius:3px;overflow:hidden}
#simuemploi-candidat-v1 .se-meter span{display:block;height:100%;background:var(--se-accent)}
#simuemploi-candidat-v1 .se-question{font-size:22px;line-height:1.45;font-weight:600}
#simuemploi-candidat-v1 .se-footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--se-soft);font-size:11px;padding-top:12px;border-top:1px solid var(--se-line)}
#simuemploi-candidat-v1 .se-autonomous .se-home-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
#simuemploi-candidat-v1 .se-autonomous .se-practice-layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(180px,1fr);gap:14px;align-items:start}
#simuemploi-candidat-v1 .se-guided .se-only-autonomous{display:none}
#simuemploi-candidat-v1 .se-guided .se-home-layout,#simuemploi-candidat-v1 .se-guided .se-practice-layout{display:grid;gap:16px}
#simuemploi-candidat-v1 .se-login{max-width:480px;width:100%;margin:0 auto}
#simuemploi-candidat-v1 .se-empty{text-align:center;padding:30px 16px;display:grid;gap:14px;justify-items:center}
#simuemploi-candidat-v1 .se-status-icon{font-size:27px;color:var(--se-accent)}
#simuemploi-candidat-v1 .se-modal-backdrop{padding:20px;border-radius:var(--se-radius);background:var(--se-error-bg);display:grid;gap:13px}
#simuemploi-candidat-v1 .se-product [data-lucide]{display:inline-block;width:16px;height:16px;flex-shrink:0}
@media(max-width:820px){#simuemploi-candidat-v1 .se-autonomous .se-home-layout,#simuemploi-candidat-v1 .se-autonomous .se-practice-layout{grid-template-columns:1fr}#simuemploi-candidat-v1 .se-shell{grid-template-columns:140px minmax(0,1fr)}#simuemploi-candidat-v1 .se-main{--se-pad:20px}}
@media(max-width:620px){#simuemploi-candidat-v1 .se-preview-controls{padding-right:0}#simuemploi-candidat-v1 .se-preview-controls label{min-width:0;flex:1 1 140px}#simuemploi-candidat-v1 .se-product{min-height:1040px;border-radius:16px}#simuemploi-candidat-v1 .se-top{padding:15px;gap:10px}#simuemploi-candidat-v1 .se-country{display:none}#simuemploi-candidat-v1 .se-shell{display:flex;flex-direction:column}#simuemploi-candidat-v1 .se-nav{order:2;border-right:0;border-top:1px solid var(--se-line);padding:9px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}#simuemploi-candidat-v1 .se-nav button{flex-direction:column;text-align:center;gap:4px;font-size:11px;padding:9px 2px}#simuemploi-candidat-v1 .se-nav .se-nav-note{display:none}#simuemploi-candidat-v1 .se-main{--se-pad:16px;gap:16px}#simuemploi-candidat-v1 .se-product h1{font-size:25px}#simuemploi-candidat-v1 .se-hero{padding:20px}#simuemploi-candidat-v1 .se-hero h2{font-size:24px}#simuemploi-candidat-v1 .se-grid{grid-template-columns:1fr}#simuemploi-candidat-v1 .se-panel{padding:17px}#simuemploi-candidat-v1 .se-question{font-size:19px}#simuemploi-candidat-v1 .se-actions .se-btn{flex:1 1 145px}}
@media(prefers-reduced-motion:no-preference){#simuemploi-candidat-v1 .se-btn{transition:background .15s ease}}
</style>
<script>
(() => {
  const root=document.getElementById('simuemploi-candidat-v1');
  const screens=[['welcome','C01 · Découvrir'],['login','C02 · Connexion'],['preferences','C03 · Mon objectif'],['home','C04 · Accueil candidat'],['catalog','C05 · Exercices'],['prepare','C06 · Préparer la session'],['practice','C07 · Répondre'],['feedback','C08 · Retour sur la réponse'],['finish','C09 · Fin de session'],['history','C10 · Historique'],['report','C11 · Rapport'],['account','C12 · Compte et données']];
  const selector=root.querySelector('#se-screen');
  selector.innerHTML=screens.map(([id,label])=>`<option value="${id}">${label}</option>`).join('');
  const saved=globalThis.openai?.widgetState?.modelContent;
  const validScreen=screens.some(s=>s[0]===saved?.screen)?saved.screen:'home';
  const sampleAnswer="Lors de mon stage dans une boutique à Ouagadougou, j’ai accueilli les clients et suivi leurs demandes. Une cliente avait reçu une commande incomplète. J’ai vérifié la livraison avec mon responsable et organisé l’envoi du produit manquant. La cliente a confirmé sa réception le lendemain.";
  const variants=[...root.querySelectorAll('.se-product')].map((element,index)=>({element,index,screen:validScreen,situation:'normal',answer:sampleAnswer,question:1,message:'',confirmDelete:false,paused:false,scenario:'Service client',density:26,radius:18,accent:index?'#21598a':'#12675d',customAccent:false}));
  selector.value=validScreen;
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button=(label,action,kind='primary',extra='')=>`<button type="button" class="se-btn ${kind==='primary'?'se-btn-primary':kind==='danger'?'se-btn-danger':kind==='quiet'?'se-btn-quiet':''}" data-action="${action}" ${extra}>${label}</button>`;
  const go=(label,screen,kind='primary')=>button(label,`go:${screen}`,kind);
  const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function save(v){if(globalThis.openai?.setWidgetState)globalThis.openai.setWidgetState({modelContent:{screen:v.screen,variant:v.index?'Espace autonome':'Parcours guidé'},privateContent:null}).catch(()=>{});}
  function title(kicker,heading,sub){return `<div class="se-heading"><span class="se-kicker">${kicker}</span><h1>${heading}</h1><p class="se-sub">${sub}</p></div>`;}
  function exercise(name,kind,description){return `<article class="se-panel"><div class="se-row"><span class="se-pill">${kind}</span><span class="se-sub">Texte</span></div><h3>${name}</h3><p class="se-sub">${description}</p><div class="se-meta"><span>5 questions</span><span>Environ 12 min</span></div>${button('Préparer cet exercice','scenario:'+name,'secondary')}</article>`;}
  function notices(v){let html='';if(v.situation==='offline')html+='<div class="se-note" role="status">Connexion interrompue. Vos réponses locales restent en attente de synchronisation. L’analyse sera disponible après le retour du réseau.</div>';if(v.message)html+=`<div class="${v.message.startsWith('Votre réponse est trop courte')?'se-alert':'se-note'}" role="status">${esc(v.message)}</div>`;return html;}
  function content(v){
    const q=v.question;
    const question=q===1?'Présentez une expérience où vous avez aidé un client à résoudre un problème.':q===2?'Comment réagiriez-vous face à un client insatisfait ?':q===3?'Comment organisez-vous plusieurs demandes en même temps ?':q===4?'Comment vérifiez-vous qu’une demande est bien résolue ?':'Que souhaitez-vous améliorer dans votre manière de communiquer ?';
    switch(v.screen){
      case 'welcome':return `${title('Préparation à l’emploi','Un entretien se prépare, une réponse à la fois.','Entraînez-vous avec des exercices proches de votre métier et du contexte burkinabè.')}<div class="se-hero"><h2>Pratiquer. Comprendre. Recommencer.</h2><p class="se-sub">Répondez à votre rythme, recevez des conseils fondés sur vos réponses et choisissez votre prochain objectif.</p><div class="se-actions">${go('Créer mon compte','login')}${go('Voir les exercices','catalog','secondary')}</div></div><div class="se-grid"><article class="se-panel"><h3>Accessible en texte</h3><p class="se-sub">Un smartphone suffit pour commencer. Aucun microphone ni caméra nécessaire.</p></article><article class="se-panel"><h3>Un entraînement privé</h3><p class="se-sub">Vos réponses et vos rapports sont accessibles depuis votre compte.</p></article></div><p class="se-sub">SimuEmploi vous aide à vous préparer. Le service ne garantit pas une embauche.</p>`;
      case 'login':return `<div class="se-login se-section">${title('Mon espace','Bienvenue sur SimuEmploi','Connectez-vous pour conserver vos entraînements.')}<div class="se-panel"><label class="se-field">Adresse email<input type="email" placeholder="vous@exemple.bf" autocomplete="off"></label><div class="se-actions">${go('Continuer vers la connexion','preferences')}</div><p class="se-sub">Votre compte vous permet de retrouver vos entraînements sur cet appareil.</p><div class="se-line"></div>${go('Découvrir les exercices','catalog','quiet')}<p class="se-sub">En continuant, vous acceptez les conditions d’utilisation et prenez connaissance de la notice de confidentialité.</p></div></div>`;
      case 'preferences':return `${title('Votre objectif','Quel entretien préparez-vous ?','Ces préférences servent à proposer des exercices adaptés.')}<div class="se-panel"><label class="se-field">Mon objectif<select><option>Un entretien d’emploi</option><option>Un entretien de stage</option><option>Un oral professionnel</option></select></label><label class="se-field">Domaine professionnel<select><option>Service client et commerce</option><option>Administration</option><option>Comptabilité</option><option>Logistique</option></select></label><label class="se-field">Mon expérience<select><option>Première recherche ou stage</option><option>Expérience professionnelle</option><option>Reconversion</option></select></label><div class="se-note">Vous pourrez modifier ces préférences à tout moment.</div>${go('Enregistrer mon objectif','home')}</div>`;
      case 'home':return `${title('Votre espace privé','Bonjour Aminata','Quel point souhaitez-vous travailler aujourd’hui ?')}<div class="se-home-layout"><div class="se-hero"><span class="se-kicker">${v.index?'Votre prochain entraînement':'Un exercice pour commencer'}</span><h2>Présenter une expérience avec clarté</h2><p class="se-sub">Un exercice de service client pour expliquer une situation, vos actions et le résultat obtenu.</p><div class="se-meta"><span>5 questions</span><span>Environ 12 min</span><span>Réponse texte</span></div><div class="se-actions">${go('Préparer mon entraînement','prepare')}${go('Explorer les exercices','catalog','secondary')}</div></div><div class="se-panel ${v.index?'':'se-only-autonomous'}"><h3>Choisir mon point de travail</h3><ul class="se-list"><li><span class="se-step">1</span><span>Illustrer une expérience</span></li><li><span class="se-step">2</span><span>Répondre à une situation difficile</span></li><li><span class="se-step">3</span><span>Préciser un résultat</span></li></ul>${go('Choisir un exercice','catalog','secondary')}</div></div><div class="se-section"><div class="se-row"><h2>Mon dernier entraînement</h2>${go('Tout l’historique','history','quiet')}</div>${v.situation==='empty'?`<div class="se-panel se-empty"><h3>Votre premier essai vous attend</h3><p class="se-sub">Votre historique apparaîtra après une session.</p>${go('Commencer un exercice','catalog')}</div>`:`<article class="se-panel"><div class="se-row"><h3>Service client · Expliquer une expérience</h3><span class="se-pill">Rapport disponible</span></div><p class="se-sub">À retravailler : préciser le résultat de vos actions.</p><div class="se-actions">${go('Relire le rapport','report','secondary')}${go('Refaire un exercice','prepare','quiet')}</div></article>`}</div>`;
      case 'catalog':return `${title('Exercices','Trouvez une situation à pratiquer','Commencez par un exercice adapté à votre objectif.')}<div class="se-panel"><label class="se-field">Domaine<select data-field="domain"><option>Tous les domaines</option><option>Service client et commerce</option><option>Administration</option></select></label></div><div class="se-grid" data-exercises>${exercise('Service client','Commerce','Présenter une expérience et traiter une réclamation.')}${exercise('Assistant administratif','Administration','Organiser les demandes et expliquer vos priorités.')}${exercise('Premier entretien de stage','Début de parcours','Présenter votre motivation et vos expériences utiles.')}${exercise('Présentation professionnelle','Tous domaines','Expliquer votre parcours et votre projet professionnel.')}</div>`;
      case 'prepare':return `${title('Avant de commencer',esc(v.scenario),'Prenez connaissance du déroulement de votre session.')}<div class="se-grid"><div class="se-panel"><h3>Votre exercice</h3><div class="se-meta"><span>5 questions</span><span>Environ 12 min</span></div><ul class="se-list"><li><span class="se-step">1</span><span>Une question à la fois, à votre rythme.</span></li><li><span class="se-step">2</span><span>Relisez votre réponse avant de la valider.</span></li><li><span class="se-step">3</span><span>Recevez un conseil concret puis continuez.</span></li></ul></div><div class="se-panel"><h3>Répondre en texte</h3><p class="se-sub">Écrivez une réponse fidèle à votre expérience. Vous pouvez faire une pause et reprendre la session.</p><div class="se-note">Évitez de saisir des informations personnelles sur d’autres personnes.</div></div></div><div class="se-actions">${button('Commencer la session','start')}${go('Choisir un autre exercice','catalog','secondary')}</div>`;
      case 'practice':return `${title('Session en cours',esc(v.scenario),'Prenez le temps de répondre avec vos propres mots.')}<div class="se-row"><span class="se-sub">Question ${q} sur 5</span>${button('Faire une pause','pause','quiet')}</div><div class="se-meter" role="progressbar" aria-label="Questions de la session" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${q-1}"><span style="width:${(q-1)*20}%"></span></div>${v.paused?`<div class="se-panel se-empty"><h2>Session en pause</h2><p class="se-sub">Votre brouillon est conservé sur cet appareil. Une réponse est sauvegardée en ligne après confirmation.</p>${button('Reprendre ma réponse','resume')}</div>`:`<div class="se-practice-layout"><div class="se-panel"><p class="se-question">${question}</p><label class="se-field">Votre réponse<textarea data-field="answer" ${v.readOnly?'readonly':''} aria-describedby="${v.element.id}-draft">${esc(v.answer)}</textarea></label><div class="se-row"><span class="se-sub" id="${v.element.id}-draft">${v.readOnly?'Réponse validée · lecture seule':v.situation==='offline'?'Brouillon local · à synchroniser':'Brouillon · réponse à valider'}</span><span class="se-sub" data-word-count>${v.answer.trim().split(/\s+/).filter(Boolean).length} mots</span></div><div class="se-actions">${button(v.readOnly?'Retour au commentaire':v.situation==='offline'?'Conserver ma réponse localement':'Valider ma réponse','submit')}${button('Relire les conseils','help','secondary')}</div></div><aside class="se-panel ${v.index?'':'se-only-autonomous'}"><h3>Pour structurer votre réponse</h3><ul class="se-list"><li><span class="se-step">S</span><span>La situation et votre rôle</span></li><li><span class="se-step">A</span><span>Les actions que vous avez réalisées</span></li><li><span class="se-step">R</span><span>Le résultat observé</span></li></ul><p class="se-sub">Cette aide correspond à la question sur votre expérience.</p></aside></div>`}`;
      case 'feedback':if(v.situation==='loading')return `${title('Réponse sauvegardée','Votre retour est en préparation','Vous pouvez quitter cette page et retrouver le résultat dans votre session.')}<div class="se-panel se-empty"><span class="se-status-icon" aria-hidden="true">…</span><h3>Analyse en cours</h3><p class="se-sub">Votre réponse est conservée. Le temps d’attente peut varier.</p>${button('Consulter à nouveau','retry','secondary')}</div>`;if(v.situation==='failed')return `${title('Réponse sauvegardée','Le retour est temporairement indisponible','Votre réponse reste dans la session.')}<div class="se-alert" role="alert">L’analyse n’a pas abouti. Aucune appréciation n’a été ajoutée.</div><div class="se-actions">${button('Réessayer l’analyse','retry')}${button('Continuer sans retour','next','secondary')}</div>`;if(v.situation==='offline')return `${title('Réponse en attente','Retrouvons votre connexion','L’analyse pourra commencer après la synchronisation.')}<div class="se-panel"><p class="se-sub">Votre brouillon est conservé sur cet appareil. Il n’est pas encore confirmé sur le serveur.</p>${button('Vérifier la connexion','retry','secondary')}</div>`;return `${title('Question '+q+' sur 5','Un retour pour votre prochain essai','Ce retour porte sur le contenu de la réponse validée.')}<div class="se-grid"><article class="se-panel"><span class="se-pill">Point d’appui</span><h3>Vous décrivez une action concrète</h3><blockquote class="se-quote">« J’ai vérifié la livraison avec mon responsable et organisé l’envoi du produit manquant. »</blockquote><p class="se-sub">Cet exemple permet de comprendre votre rôle dans la résolution du problème.</p></article><article class="se-panel"><span class="se-pill se-pill-warm">À travailler</span><h3>Précisez le résultat</h3><p class="se-sub">Expliquez ce qui a changé pour la cliente après votre intervention, en restant fidèle aux faits.</p><p class="se-sub">Pour un nouvel essai : ajoutez une phrase sur le résultat et ce que vous avez appris.</p></article></div><div class="se-actions">${button(q===5?'Terminer la session':'Passer à la question suivante','next')}${go('Relire ma réponse','practice','secondary')}</div><p class="se-sub">L’IA peut se tromper. Vous pouvez signaler un retour qui ne correspond pas à votre réponse.</p>`;
      case 'finish':return `${title('Session terminée','Vous avez terminé cet entraînement','Votre rapport rassemble les réponses et les retours disponibles.')}<div class="se-panel"><h2>Choisissez la suite</h2><p class="se-sub">Relisez votre rapport ou faites une pause avant un nouvel exercice.</p><div class="se-actions">${go('Consulter mon rapport','report')}${go('Retour à mon accueil','home','secondary')}</div></div><div class="se-note">Un rapport peut rester en préparation après la fin de la session. Vos réponses sont conservées.</div>`;
      case 'history':return `${title('Mes entraînements','Retrouvez vos essais','Les rapports vous aident à choisir votre prochain point de travail.')}<div class="se-section">${v.situation==='empty'?`<div class="se-panel se-empty"><h3>Aucun entraînement pour le moment</h3><p class="se-sub">Commencez un exercice pour créer votre premier rapport.</p>${go('Choisir un exercice','catalog')}</div>`:`<article class="se-panel"><div class="se-row"><h3>Service client</h3><span class="se-pill">${v.situation==='loading'?'Rapport en préparation':v.situation==='partial'?'Rapport partiel':'Rapport disponible'}</span></div><div class="se-meta"><span>Exemple · 20 novembre 2026</span><span>5 réponses</span></div><p class="se-sub">Objectif : présenter une expérience.</p>${go('Ouvrir le rapport','report','secondary')}</article><article class="se-panel"><div class="se-row"><h3>Présentation professionnelle</h3><span class="se-pill se-pill-warm">En pause</span></div><p class="se-sub">Votre session peut être reprise depuis la dernière réponse confirmée.</p>${go('Reprendre la session','practice','secondary')}</article>`}</div>`;
      case 'report':if(v.situation==='loading'||v.situation==='failed')return `${title('Rapport · Service client',v.situation==='loading'?'Votre rapport est en préparation':'Le rapport est indisponible','Vos réponses restent accessibles dans votre session.')}<div class="se-panel"><p class="se-sub">${v.situation==='loading'?'Les analyses sont en cours. Revenez consulter le statut.':'La génération du rapport a échoué. Vous pouvez demander une nouvelle tentative.'}</p>${button(v.situation==='loading'?'Actualiser le statut':'Réessayer le rapport','retry','secondary')}</div>`;return `${title('Rapport · Service client','Votre prochain objectif : préciser les résultats','Synthèse de cet exercice, avec les limites des retours disponibles.')}${v.situation==='partial'?'<div class="se-note">Rapport partiel : une réponse n’a pas pu être analysée. Elle reste conservée et ne reçoit pas de note de remplacement.</div>':''}<div class="se-grid"><article class="se-panel"><h3>À conserver</h3><p class="se-sub">Vous donnez un exemple réel et expliquez votre intervention.</p></article><article class="se-panel"><h3>Au prochain essai</h3><p class="se-sub">Ajoutez le résultat obtenu et ce que cette situation vous a appris.</p></article></div><div class="se-panel"><h3>Retour fondé sur votre réponse</h3><blockquote class="se-quote">« La cliente a confirmé sa réception le lendemain. »</blockquote><p class="se-sub">Vous pouvez préciser comment vous avez vérifié que la demande était résolue.</p><div class="se-line"></div><p class="se-sub">Modalité : texte. La voix et la vidéo n’ont pas été évaluées.</p><p class="se-sub">Exercice et grille : version 1 · Coaching privé.</p></div><div class="se-actions">${go('Travailler ce point','prepare')}${go('Tous mes entraînements','history','secondary')}${button('Signaler une erreur','signal','quiet')}</div>`;
      case 'account':return `${title('Mon compte','Mes préférences et mes données','Votre espace de coaching est privé.')}<div class="se-grid"><div class="se-panel"><h3>Mon objectif</h3><p class="se-sub">Entretien d’emploi · Service client et commerce · Burkina Faso</p>${go('Modifier mes préférences','preferences','secondary')}<div class="se-line"></div><h3>Mon accès</h3><p class="se-sub">Vous pouvez gérer votre connexion et demander une aide pour retrouver votre accès.</p>${go('Me déconnecter','welcome','secondary')}</div><div class="se-panel"><h3>Mes données</h3><p class="se-sub">Demandez un export ou la suppression de vos données selon la notice du service.</p>${button('Demander un export','export','secondary')}${button('Demander la suppression','delete','danger')}</div></div>${v.confirmDelete?`<div class="se-modal-backdrop" role="alertdialog" aria-label="Confirmer la demande de suppression"><h3>Confirmer votre demande ?</h3><p>La demande sera traitée selon les règles de conservation applicables.</p><div class="se-actions">${button('Confirmer ma demande','confirm-delete','danger')}${button('Annuler','cancel-delete','secondary')}</div></div>`:''}`;
      default:return '';
    }
  }
  function render(v){
    const active=v.screen==='catalog'||v.screen==='prepare'?'catalog':['history','report','finish'].includes(v.screen)?'history':v.screen==='account'||v.screen==='preferences'?'account':'home';
    v.element.innerHTML=`<header class="se-top"><div class="se-brand"><span class="se-logo" aria-hidden="true">S</span>SimuEmploi<span class="se-country">Burkina Faso</span></div><div class="se-avatar" aria-label="Compte d’exemple Aminata">AM</div></header><div class="se-shell"><nav class="se-nav" aria-label="Navigation candidat">${[['home','Accueil','house'],['catalog','Exercices','notebook-pen'],['history','Historique','history'],['account','Mon compte','user-round']].map(([id,label,ic])=>`<button type="button" data-action="go:${id}" ${active===id?'aria-current="page"':''}>${icon(ic)}${label}</button>`).join('')}<div class="se-nav-note">Un espace pour pratiquer à votre rythme.<br><br>Coaching privé</div></nav><main class="se-main" aria-label="Écran candidat"><div class="se-crumb"><span>${screens.find(s=>s[0]===v.screen)?.[1].replace(/^C\d+ · /,'')}</span><span>Espace candidat</span></div>${notices(v)}${content(v)}<footer class="se-footer"><span>Vos réponses vous appartiennent.</span><span>Confidentialité · Aide</span></footer></main></div>`;
    v.element.style.setProperty('--se-radius',v.radius+'px');
    v.element.style.setProperty('--se-pad',v.density+'px');
    if(v.customAccent){v.element.style.setProperty('--se-accent',v.accent);const hex=v.accent.slice(1);const rgb=[0,2,4].map(i=>parseInt(hex.slice(i,i+2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);const lum=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2];v.element.style.setProperty('--se-on-accent',lum>.18?'#102b2d':'#ffffff');}
    if(globalThis.lucide?.createIcons)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  }
  variants.forEach(v=>{
    render(v);
    v.element.addEventListener('input',e=>{if(e.target.matches('[data-field="answer"]')){v.answer=e.target.value;const counter=v.element.querySelector('[data-word-count]');if(counter)counter.textContent=v.answer.trim().split(/\s+/).filter(Boolean).length+' mots';}});
    v.element.addEventListener('change',e=>{if(e.target.matches('[data-field="domain"]')){const rows=v.element.querySelectorAll('[data-exercises] article');rows.forEach((r,i)=>{r.hidden=e.target.selectedIndex===1?i!==0:e.target.selectedIndex===2?i!==1:false;});}});
    v.element.addEventListener('click',e=>{
      const control=e.target.closest('[data-action]');if(!control)return;const action=control.dataset.action;v.message='';
      if(action.startsWith('go:')){v.readOnly=action==='go:practice'&&v.screen==='feedback';v.screen=action.slice(3);v.confirmDelete=false;}
      else if(action.startsWith('scenario:')){v.scenario=action.slice(9);v.screen='prepare';}
      else if(action==='start'){v.readOnly=false;v.screen='practice';v.question=1;v.answer=sampleAnswer;v.paused=false;}
      else if(action==='pause'){v.paused=true;}
      else if(action==='resume'){v.paused=false;}
      else if(action==='submit'){
        if(v.readOnly)v.screen='feedback';else if(v.answer.trim().length<20)v.message='Votre réponse est trop courte pour cet exercice. Ajoutez une situation et vos actions.';
        else if(v.situation==='offline')v.message='Réponse conservée sur cet appareil, en attente de synchronisation.';
        else v.screen='feedback';
      }
      else if(action==='next'){if(v.question===5)v.screen='finish';else{v.question++;v.readOnly=false;v.screen='practice';v.answer='';}}
      else if(action==='retry'){v.situation='normal';root.querySelector('#se-situation').value='normal';v.message='Le statut a été actualisé.';}
      else if(action==='help')v.message='Pour cette question, décrivez une situation, votre rôle, vos actions puis le résultat.';
      else if(action==='signal')v.message='Votre signalement a été enregistré pour examen.';
      else if(action==='export')v.message='Votre demande d’export a été enregistrée. Son statut sera disponible dans votre compte.';
      else if(action==='delete')v.confirmDelete=true;
      else if(action==='cancel-delete')v.confirmDelete=false;
      else if(action==='confirm-delete'){v.confirmDelete=false;v.message='Votre demande de suppression a été enregistrée.';}
      selector.value=v.screen;render(v);save(v);
    });
    v.element.addEventListener('submit',e=>e.preventDefault());
    if(globalThis.Tweak){const tweak=new Tweak({container:v.element,onChange:()=>{v.customAccent=true;render(v);}});tweak.addSlider(v,'radius',{label:'Arrondi des surfaces',min:8,max:24,unit:'px'});tweak.addSlider(v,'density',{label:'Espacement du contenu',min:16,max:32,unit:'px'});tweak.addColorPicker(v,'accent',{label:'Couleur des actions',reference:'--se-accent'});}
  });
  selector.addEventListener('change',()=>{variants.forEach(v=>{v.screen=selector.value;v.message='';v.confirmDelete=false;v.paused=false;v.readOnly=false;render(v);});save(variants[0]);});
  root.querySelector('#se-situation').addEventListener('change',e=>{variants.forEach(v=>{v.situation=e.target.value;v.message='';render(v);});});
})();
</script>
